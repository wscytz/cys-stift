<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cys-dsl 内核调试台</title>
<style>
  :root {
    --bg: #141412; --panel: #1d1d1b; --line: #2c2c29; --text: #d8d6d0;
    --dim: #8a8880; --accent: #e11900; --ok: #0a8a4a; --src: #2f6feb; --dst: #0a8a4a;
    --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 var(--mono); }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0; letter-spacing: .04em; }
  #stamp { color: var(--dim); font-size: 11px; }
  .chip { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 11px; cursor: pointer; }
  .chip.ok { color: var(--ok); border-color: var(--ok); }
  .chip.bad { color: var(--accent); border-color: var(--accent); }
  nav { margin-left: auto; display: flex; gap: 6px; }
  nav button { background: none; border: 1px solid var(--line); color: var(--dim); padding: 4px 14px; font: inherit; cursor: pointer; border-radius: 4px; }
  nav button.on { color: var(--text); border-color: var(--accent); }
  button.act { background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 4px 10px; font: inherit; cursor: pointer; border-radius: 4px; }
  button.act:hover { border-color: var(--dim); }
  main { padding: 12px 16px; }
  #tab-route { display: flex; gap: 12px; height: calc(100vh - 54px); }
  #stage-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #stage { flex: 1; background: #191917; border: 1px solid var(--line); width: 100%; touch-action: none; }
  #readout { display: flex; flex-wrap: wrap; gap: 14px; padding: 8px 2px 0; color: var(--dim); font-size: 12px; }
  #readout b { color: var(--text); font-weight: 500; }
  #readout .bad { color: var(--accent); } #readout .ok { color: var(--ok); }
  aside { width: 300px; overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }
  aside section { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--panel); }
  aside h2 { font-size: 11px; margin: 0 0 8px; color: var(--dim); font-weight: 500; letter-spacing: .08em; }
  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row label { flex: 0 0 88px; color: var(--dim); }
  .row output { flex: 0 0 44px; text-align: right; color: var(--text); }
  .row input[type=range] { flex: 1; accent-color: var(--accent); }
  .cbs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
  .cbs label { display: flex; gap: 6px; align-items: center; color: var(--text); cursor: pointer; }
  .cbs input { accent-color: var(--accent); }
  .radios label { margin-right: 14px; cursor: pointer; }
  details textarea { width: 100%; height: 130px; background: var(--bg); color: var(--text); border: 1px solid var(--line); font: 11px var(--mono); }
  #selftest-detail { margin: 6px 16px 0; color: var(--dim); font-size: 11px; white-space: pre-wrap; }
  #selftest-detail .f { color: var(--accent); } #selftest-detail .p { color: var(--ok); }
  /* DSL tab */
  #tab-dsl { display: flex; gap: 12px; height: calc(100vh - 54px); }
  #dsl-left { flex: 0 0 40%; display: flex; flex-direction: column; gap: 8px; }
  #dsl-in { flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--line); font: 12px var(--mono); padding: 10px; resize: none; }
  #dsl-right { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #dsl-stats { color: var(--dim); font-size: 12px; display: flex; gap: 16px; flex-wrap: wrap; }
  #dsl-svg { flex: 1; overflow: auto; border: 1px solid var(--line); background: #fff; padding: 8px; }
  #dsl-diag { max-height: 180px; overflow-y: auto; font-size: 11px; color: var(--dim); white-space: pre-wrap; }
  #dsl-diag .e { color: var(--accent); } #dsl-diag .w { color: #c08a00; }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--line); font: inherit; padding: 3px 6px; border-radius: 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>cys-dsl 内核调试台</h1>
  <span id="stamp">__STAMP__</span>
  <span id="selftest" class="chip" title="点击展开">自检…</span>
  <nav>
    <button class="on" data-tab="route">走线调试台</button>
    <button data-tab="dsl">DSL 试玩</button>
  </nav>
</header>
<details id="selftest-detail" hidden></details>

<main id="tab-route">
  <div id="stage-wrap">
    <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="readout"></div>
  </div>
  <aside>
    <section>
      <h2>场景预设</h2>
      <div class="pgrid">
        <button class="act" data-preset="stagger">交错 688</button>
        <button class="act" data-preset="trap">陷阱</button>
        <button class="act" data-preset="corridor">窄走廊</button>
        <button class="act" data-preset="wander">单障碍游走</button>
        <button class="act" data-preset="dead">围死(无解)</button>
        <button class="act" data-preset="random">随机场景</button>
      </div>
    </section>
    <section>
      <h2>模式与参数</h2>
      <div class="row radios">
        <label><input type="radio" name="mode" value="free"> free</label>
        <label><input type="radio" name="mode" value="orthogonal" checked> orthogonal</label>
      </div>
      <div class="row"><label>λ 折价</label><input id="p-bend" type="range" min="0" max="64" step="1" title="bendPenalty,转折的视觉代价"><output id="o-bend"></output></div>
      <div class="row"><label>μ 折返罚</label><input id="p-uturn" type="range" min="0" max="16" step="1" title="uturnPenalty,非单调折返微惩罚"><output id="o-uturn"></output></div>
      <div class="row"><label>margin</label><input id="p-margin" type="range" min="0" max="48" step="1" title="障碍外扩走廊间距"><output id="o-margin"></output></div>
      <div class="row"><label>minStub</label><input id="p-stub" type="range" min="0" max="48" step="1" title="端口引出段最短长度"><output id="o-stub"></output></div>
      <div class="row"><label>minGap</label><input id="p-gap" type="range" min="0" max="24" step="1" title="间隙走廊最小空隙"><output id="o-gap"></output></div>
      <div class="row"><label>quant</label><select id="p-quant"><option>0.25</option><option selected>0.5</option><option>1</option></select><span style="color:var(--dim)">轴量化 px</span></div>
    </section>
    <section>
      <h2>叠层</h2>
      <div class="cbs">
        <label><input type="checkbox" id="c-path" checked> 路径</label>
        <label><input type="checkbox" id="c-axes"> 轴集</label>
        <label><input type="checkbox" id="c-ports" checked> 端口+引出段</label>
        <label><input type="checkbox" id="c-corr"> 走廊(外扩)</label>
        <label><input type="checkbox" id="c-mid"> 源目中线</label>
        <label><input type="checkbox" id="c-legacy"> routeAround 对比</label>
      </div>
    </section>
    <section>
      <h2>场景数据</h2>
      <details>
        <summary style="cursor:pointer;color:var(--dim)">JSON 导出 / 导入</summary>
        <textarea id="scene-json" spellcheck="false"></textarea>
        <div style="display:flex;gap:6px;margin-top:6px">
          <button class="act" id="b-export">导出到文本框</button>
          <button class="act" id="b-import">从文本框导入</button>
        </div>
      </details>
    </section>
  </aside>
</main>

<main id="tab-dsl" hidden>
  <div id="dsl-left">
    <div style="display:flex;gap:8px;align-items:center">
      <select id="dsl-sample"></select>
      <span style="color:var(--dim)">parse → sanitize → solve → toSvg 实时(300ms 防抖)</span>
    </div>
    <textarea id="dsl-in" spellcheck="false"></textarea>
  </div>
  <div id="dsl-right">
    <div id="dsl-stats"></div>
    <div id="dsl-svg"></div>
    <div id="dsl-diag"></div>
  </div>
</main>

<script type="module">
import * as K from '__INDEX_URL__'
import { planRoute, debugRoute, DEFAULT_ROUTING } from '__ROUTING_URL__'

/* ————— 状态 ————— */
const scene = { src: { x: 0, y: 0, w: 200, h: 100 }, dst: { x: 600, y: 300, w: 200, h: 100 }, obs: [], mode: 'orthogonal' }
const cfg = { ...DEFAULT_ROUTING }
const seedBox = { value: 20261026 }

const PRESETS = {
  stagger: { src: { x: 0, y: 0, w: 200, h: 100 }, dst: { x: 600, y: 300, w: 200, h: 100 }, obs: [], mode: 'orthogonal' },
  trap: { src: { x: 0, y: 0, w: 200, h: 100 }, dst: { x: 600, y: 300, w: 200, h: 100 }, obs: [{ x: 552, y: 150, w: 64, h: 100 }], mode: 'orthogonal' },
  corridor: { src: { x: 0, y: 0, w: 100, h: 60 }, dst: { x: 500, y: 0, w: 100, h: 60 }, obs: [{ x: 200, y: -50, w: 100, h: 160 }], mode: 'orthogonal' },
  wander: { src: { x: 0, y: 100, w: 160, h: 80 }, dst: { x: 520, y: 100, w: 160, h: 80 }, obs: [{ x: 280, y: 40, w: 80, h: 180 }], mode: 'free' },
  dead: { src: { x: 300, y: 200, w: 120, h: 80 }, dst: { x: 700, y: 200, w: 120, h: 80 },
    obs: [{ x: 250, y: 120, w: 220, h: 16 }, { x: 250, y: 344, w: 220, h: 16 }, { x: 250, y: 136, w: 16, h: 208 }, { x: 454, y: 136, w: 16, h: 208 }], mode: 'orthogonal' },
}

/* ————— 工具 ————— */
const center = (r) => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 })
function borderPoint(r, toward) { // 中心连线与矩形边界的交点(to-svg 同款语义的页面复刻)
  const c = center(r), dx = toward.x - c.x, dy = toward.y - c.y
  let best = 1
  if (dx !== 0) for (const t of [(r.x - c.x) / dx, (r.x + r.w - c.x) / dx]) if (t > 0 && t <= 1 && t < best) best = t
  if (dy !== 0) for (const t of [(r.y - c.y) / dy, (r.y + r.h - c.y) / dy]) if (t > 0 && t <= 1 && t < best) best = t
  return { x: c.x + dx * best, y: c.y + dy * best }
}
const pathLen = (p) => { let n = 0; for (let i = 1; i < p.length; i++) n += Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y); return n }
function segHitsOpenInterior(p, q, r, eps) { // 开内域复刻:内缩 eps 后闭盒,平行贴边不算,擦点(t0==t1)不算
  const x0 = r.x + eps, y0 = r.y + eps, x1 = r.x + r.w - eps, y1 = r.y + r.h - eps
  if (x1 <= x0 || y1 <= y0) return false
  let t0 = 0, t1 = 1
  const dx = q.x - p.x, dy = q.y - p.y
  for (const [pi, di, lo, hi] of [[p.x, dx, x0, x1], [p.y, dy, y0, y1]]) {
    if (Math.abs(di) < 1e-12) { if (pi <= lo || pi >= hi) return false }
    else {
      let a = (lo - pi) / di, b = (hi - pi) / di
      if (a > b) [a, b] = [b, a]
      t0 = Math.max(t0, a); t1 = Math.min(t1, b)
      if (t0 >= t1) return false
    }
  }
  return t1 - t0 > 1e-9
}
function crossings(path, rects, eps) {
  let n = 0
  for (let i = 1; i < path.length; i++) for (const r of rects) if (segHitsOpenInterior(path[i - 1], path[i], r, eps)) n++
  return n
}
function mulberry32(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
function randomScene(seed) {
  const rng = mulberry32(seed)
  const s = { src: { x: 20, y: 200, w: 160, h: 80 }, dst: { x: 720, y: 200, w: 160, h: 80 }, obs: [], mode: 'orthogonal' }
  const clear = (r) => !(r.x < s.src.x + s.src.w + 60 && r.x + r.w > s.src.x - 60 && r.y < s.src.y + s.src.h + 60 && r.y + r.h > s.src.y - 60) &&
    !(r.x < s.dst.x + s.dst.w + 60 && r.x + r.w > s.dst.x - 60 && r.y < s.dst.y + s.dst.h + 60 && r.y + r.h > s.dst.y - 60)
  for (let i = 0; i < 6; i++) for (let tries = 0; tries < 60; tries++) {
    const r = { x: 60 + rng() * 560, y: 20 + rng() * 380, w: 60 + rng() * 80, h: 50 + rng() * 90 }
    if (!clear(r)) continue
    if (s.obs.some((o) => r.x < o.x + o.w + 40 && r.x + r.w > o.x - 40 && r.y < o.y + o.h + 40 && r.y + r.h > o.y - 40)) continue
    s.obs.push(r); break
  }
  return s
}

/* ————— 走线台渲染 ————— */
const svg = document.getElementById('stage')
const readout = document.getElementById('readout')
const ov = () => ({
  path: document.getElementById('c-path').checked,
  axes: document.getElementById('c-axes').checked,
  ports: document.getElementById('c-ports').checked,
  corr: document.getElementById('c-corr').checked,
  mid: document.getElementById('c-mid').checked,
  legacy: document.getElementById('c-legacy').checked,
})
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
const line = (a, b, stroke, dash, w = 1) => `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${stroke}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`
const poly = (pts, stroke, dash, w = 2) => `<polyline points="${pts.map((p) => `${p.x},${p.y}`).join(' ')}" fill="none" stroke="${stroke}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ''} stroke-linejoin="round"/>`

let rafPending = false
function scheduleDraw() { if (rafPending) return; rafPending = true; requestAnimationFrame(() => { rafPending = false; draw() }) }

function draw() {
  const p1 = borderPoint(scene.src, center(scene.dst))
  const p2 = borderPoint(scene.dst, center(scene.src))
  const times = []
  let path = null
  for (let i = 0; i < 10; i++) { const t0 = performance.now(); path = planRoute(p1, p2, scene.src, scene.dst, scene.obs, scene.mode, cfg); times.push(performance.now() - t0) }
  const avg = times.reduce((a, b) => a + b) / times.length
  const dbg = debugRoute(p1, p2, scene.src, scene.dst, scene.obs, cfg)
  const legacy = K.routeAround(p1, p2, scene.src, scene.dst, scene.obs, cfg.margin)
  const L = ov()
  const pad = 48, v = dbg.view
  const parts = [`<g id="layers">`]
  if (L.axes) {
    parts.push(`<g stroke="#3a3a36" stroke-width="1">`)
    for (const x of dbg.xs) parts.push(`<line x1="${x}" y1="${v.y - pad}" x2="${x}" y2="${v.y + v.h + pad}"/>`)
    for (const y of dbg.ys) parts.push(`<line x1="${v.x - pad}" y1="${y}" x2="${v.x + v.w + pad}" y2="${y}"/>`)
    parts.push(`</g>`)
  }
  if (L.corr) for (const r of dbg.active) {
    const e = { x: r.x - cfg.margin, y: r.y - cfg.margin, w: r.w + 2 * cfg.margin, h: r.h + 2 * cfg.margin }
    parts.push(`<rect x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}" fill="none" stroke="#c08a00" stroke-width="1" stroke-dasharray="3 4"/>`)
  }
  if (L.mid) parts.push(line(center(scene.src), center(scene.dst), '#555', '2 6', 1))
  if (L.legacy && legacy) parts.push(poly(legacy, '#8a8880', '6 4', 1.5))
  if (L.ports) {
    parts.push(`<g>`)
    for (let i = 0; i < dbg.sPorts.length; i++) {
      const pt = dbg.sPorts[i].pt
      parts.push(`<circle cx="${pt.x}" cy="${pt.y}" r="3" fill="#2f6feb"/>`)
      if (dbg.starts[i]) parts.push(line(pt, dbg.starts[i], '#2f6feb55', '2 3', 1))
    }
    for (let i = 0; i < dbg.tPorts.length; i++) {
      const pt = dbg.tPorts[i].pt
      parts.push(`<circle cx="${pt.x}" cy="${pt.y}" r="3" fill="#0a8a4a"/>`)
      if (dbg.ends[i]) parts.push(line(pt, dbg.ends[i], '#0a8a4a55', '2 3', 1))
    }
    parts.push(`</g>`)
  }
  if (L.path && path) {
    parts.push(poly(path, '#e11900', null, 2))
    for (const p of path) parts.push(`<circle cx="${p.x}" cy="${p.y}" r="2.5" fill="#e11900"/>`)
  }
  const card = (r, label, stroke, dragKey) =>
    `<g><rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="${stroke}22" stroke="${stroke}" stroke-width="1.5" data-drag="${dragKey}" style="cursor:move"/>` +
    `<text x="${r.x + 6}" y="${r.y + 16}" fill="${stroke}" font-size="11" font-family="monospace" pointer-events="none">${esc(label)}</text>` +
    `<circle cx="${r.x + r.w}" cy="${r.y + r.h}" r="5" fill="${stroke}" data-resize="${dragKey}" style="cursor:nwse-resize"/></g>`
  scene.obs.forEach((r, i) => { parts.push(card(r, `障碍${i}`, '#8a8880', `obs:${i}`)) })
  parts.push(card(scene.src, '源', '#2f6feb', 'src'))
  parts.push(card(scene.dst, '目标', '#0a8a4a', 'dst'))
  parts.push(`</g>`)
  svg.setAttribute('viewBox', `${v.x - pad} ${v.y - pad} ${v.w + 2 * pad} ${v.h + 2 * pad}`)
  svg.innerHTML = parts.join('')

  // 读数
  const len = path ? pathLen(path) : NaN
  const bends = path ? Math.max(0, path.length - 2) : NaN
  const cost = path ? len + cfg.bendPenalty * bends : NaN
  const det = (() => { const ref = JSON.stringify(planRoute(p1, p2, scene.src, scene.dst, scene.obs, scene.mode, cfg)); for (let i = 0; i < 20; i++) if (JSON.stringify(planRoute(p1, p2, scene.src, scene.dst, scene.obs, scene.mode, cfg)) !== ref) return false; return true })()
  const cross = path ? crossings(path, dbg.active, cfg.hitEpsilon) : 0
  readout.innerHTML =
    `<span>路径 <b>${path ? `${path.length} 点` : 'null(无解 → 应用层兜底)'}</b></span>` +
    `<span>长度 <b>${isNaN(len) ? '—' : len.toFixed(1)}</b></span>` +
    `<span>折 <b>${isNaN(bends) ? '—' : bends}</b></span>` +
    `<span>估算代价 <b>${isNaN(cost) ? '—' : cost.toFixed(1)}</b><span style="color:#666">(长+λ·折,未含 μ)</span></span>` +
    `<span>端口 <b>${dbg.sPorts.length}/${dbg.tPorts.length}</b></span>` +
    `<span>轴 <b>${dbg.xs.length + dbg.ys.length}</b></span>` +
    `<span>耗时 <b>${avg.toFixed(2)}ms</b>(10 次均值)</span>` +
    `<span>确定性20次 <b class="${det ? 'ok' : 'bad'}">${det ? '✓' : '✗ 不一致!'}</b></span>` +
    `<span>页面复刻零穿越 <b class="${cross === 0 ? 'ok' : 'bad'}">${cross === 0 ? '✓' : `✗ ${cross} 处`}</b></span>` +
    (legacy ? `<span>routeAround <b>${legacy.length} 点</b></span>` : '')
}

/* ————— 拖拽 / 缩放 ————— */
let drag = null
svg.addEventListener('pointerdown', (e) => {
  const t = e.target
  const key = t.getAttribute?.('data-drag') ?? t.getAttribute?.('data-resize')
  if (!key) return
  const [kind, idxStr] = key.split(':')
  const geom = kind === 'src' ? scene.src : kind === 'dst' ? scene.dst : scene.obs[+idxStr]
  drag = { kind, geom, sx: geom.x, sy: geom.y, sw: geom.w, sh: geom.h, resize: !!t.getAttribute('data-resize'), pt: svgPoint(e) }
  svg.setPointerCapture(e.pointerId)
  e.preventDefault()
})
svg.addEventListener('pointermove', (e) => {
  if (!drag) return
  const p = svgPoint(e)
  if (drag.resize) {
    drag.geom.w = Math.max(24, drag.sw + (p.x - drag.pt.x))
    drag.geom.h = Math.max(24, drag.sh + (p.y - drag.pt.y))
  } else {
    drag.geom.x = drag.sx + (p.x - drag.pt.x)
    drag.geom.y = drag.sy + (p.y - drag.pt.y)
  }
  scheduleDraw()
})
const endDrag = () => { drag = null }
svg.addEventListener('pointerup', endDrag)
svg.addEventListener('pointercancel', endDrag)
function svgPoint(e) {
  return new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse())
}

/* ————— 控件绑定 ————— */
document.querySelectorAll('[data-preset]').forEach((b) => b.addEventListener('click', () => {
  const k = b.dataset.preset
  if (k === 'random') { seedBox.value = (seedBox.value * 1103515245 + 12345) % 2147483647; applyScene(randomScene(seedBox.value)) }
  else applyScene(structuredClone(PRESETS[k]))
}))
document.querySelectorAll('input[name=mode]').forEach((r) => r.addEventListener('change', () => { scene.mode = r.value; scheduleDraw() }))
const bindSlider = (id, key, out) => {
  const el = document.getElementById(id), o = document.getElementById(out)
  el.value = cfg[key]; o.textContent = cfg[key]
  el.addEventListener('input', () => { cfg[key] = +el.value; o.textContent = el.value; scheduleDraw() })
}
bindSlider('p-bend', 'bendPenalty', 'o-bend')
bindSlider('p-uturn', 'uturnPenalty', 'o-uturn')
bindSlider('p-margin', 'margin', 'o-margin')
bindSlider('p-stub', 'minStub', 'o-stub')
bindSlider('p-gap', 'minGap', 'o-gap')
document.getElementById('p-quant').addEventListener('change', (e) => { cfg.quant = +e.target.value; scheduleDraw() })
for (const id of ['c-path', 'c-axes', 'c-ports', 'c-corr', 'c-mid', 'c-legacy'])
  document.getElementById(id).addEventListener('change', scheduleDraw)

function applyScene(s) {
  scene.src = s.src; scene.dst = s.dst; scene.obs = s.obs
  scene.mode = s.mode
  document.querySelector(`input[name=mode][value="${s.mode}"]`).checked = true
  scheduleDraw()
}

/* 场景 JSON io */
const sceneJson = document.getElementById('scene-json')
document.getElementById('b-export').addEventListener('click', () => { sceneJson.value = JSON.stringify({ ...scene, cfg }, null, 1) })
document.getElementById('b-import').addEventListener('click', () => {
  try {
    const j = JSON.parse(sceneJson.value)
    if (typeof j.cfg === 'object') Object.assign(cfg, j.cfg)
    applyScene({ src: j.src, dst: j.dst, obs: j.obs ?? [], mode: j.mode ?? 'orthogonal' })
    for (const [id, key] of [['p-bend', 'bendPenalty'], ['p-uturn', 'uturnPenalty'], ['p-margin', 'margin'], ['p-stub', 'minStub'], ['p-gap', 'minGap']])
    { document.getElementById(id).value = cfg[key]; document.getElementById(id.replace('p-', 'o-')).textContent = cfg[key] }
    document.getElementById('p-quant').value = String(cfg.quant)
  } catch (err) { alert('JSON 解析失败:' + err.message) }
})

/* ————— 自检 ————— */
function runSelfTest() {
  const results = []
  const t = (name, fn) => { try { const msg = fn(); results.push([name, msg === true, msg === true ? '' : String(msg)]) } catch (e) { results.push([name, false, 'throw: ' + e.message]) } }
  const S = { x: 0, y: 0, w: 200, h: 100 }, D = { x: 600, y: 300, w: 200, h: 100 }
  t('交错卡最优 1 折 L(长 660 + λ·1)', () => {
    const p = planRoute({ x: 200, y: 50 }, { x: 600, y: 350 }, S, D, [], 'orthogonal')
    if (!p) return 'null'
    const len = pathLen(p), bends = p.length - 2
    return Math.abs(len - 660) < 0.5 && bends === 1 ? true : `len=${len.toFixed(1)} bends=${bends}(期望 660/1)`
  })
  t('陷阱场景有解且零穿越', () => {
    const obs = [{ x: 552, y: 150, w: 64, h: 100 }]
    const p = planRoute({ x: 200, y: 50 }, { x: 600, y: 350 }, S, D, obs, 'orthogonal')
    return p && crossings(p, obs, cfg.hitEpsilon) === 0 ? true : `path=${!!p} cross=${p ? crossings(p, obs, cfg.hitEpsilon) : '-'}`
  })
  t('窄走廊 4 点且含 y=-64', () => {
    const obs = [{ x: 200, y: -50, w: 100, h: 160 }]
    const p = planRoute({ x: 100, y: 30 }, { x: 500, y: 30 }, { x: 0, y: 0, w: 100, h: 60 }, { x: 500, y: 0, w: 100, h: 60 }, obs, 'orthogonal')
    return p && p.length === 4 && p.some((q) => q.y === -64) ? true : `pts=${p?.length} ys=${p ? [...new Set(p.map((q) => q.y))] : '-'}`
  })
  t('围死返回 null', () => {
    const obs = [{ x: 250, y: 120, w: 220, h: 16 }, { x: 250, y: 344, w: 220, h: 16 }, { x: 250, y: 136, w: 16, h: 208 }, { x: 454, y: 136, w: 16, h: 208 }]
    return planRoute({ x: 360, y: 240 }, { x: 760, y: 240 }, { x: 300, y: 200, w: 120, h: 80 }, { x: 700, y: 200, w: 120, h: 80 }, obs, 'orthogonal') === null
  })
  t('确定性:陷阱场景 20 次逐字节一致', () => {
    const obs = [{ x: 552, y: 150, w: 64, h: 100 }]
    const ref = JSON.stringify(planRoute({ x: 200, y: 50 }, { x: 600, y: 350 }, S, D, obs, 'orthogonal'))
    for (let i = 0; i < 20; i++) if (JSON.stringify(planRoute({ x: 200, y: 50 }, { x: 600, y: 350 }, S, D, obs, 'orthogonal')) !== ref) return false
    return true
  })
  t('toSvg 产出 <svg> 且零跳过', () => {
    const ops = K.parseDslWithDiagnostics(SAMPLES[0].src).ops
    const { svg: s, skipped } = K.toSvg(ops)
    return s.includes('<svg') && skipped.length === 0 ? true : `skipped=${skipped.length}`
  })
  t('DSL 管线 parse→sanitize→solve 零诊断', () => {
    const a = K.parseDslWithDiagnostics(SAMPLES[0].src)
    const b = K.sanitizeDslOps(a.ops)
    const c = K.solveRelational(b.ops)
    return a.errors.length === 0 && b.diagnostics.length === 0 && c.diagnostics.length === 0
      ? true : `err=${a.errors.length} san=${b.diagnostics.length} solve=${c.diagnostics.length}`
  })
  const pass = results.filter((r) => r[1]).length
  const chip = document.getElementById('selftest')
  chip.textContent = `自检 ${pass}/${results.length} ${pass === results.length ? '✅' : '❌'}`
  chip.className = 'chip ' + (pass === results.length ? 'ok' : 'bad')
  const det = document.getElementById('selftest-detail')
  det.hidden = pass === results.length
  det.innerHTML = results.map(([n, ok, msg]) => `<div class="${ok ? 'p' : 'f'}">${ok ? '✓' : '✗'} ${n}${msg ? ' —— ' + esc(msg) : ''}</div>`).join('')
  return pass === results.length
}
document.getElementById('selftest').addEventListener('click', () => {
  const det = document.getElementById('selftest-detail')
  det.hidden = !det.hidden
  if (!det.hidden) runSelfTest()
})

/* ————— DSL 试玩 ————— */
const SAMPLES = [
  { name: '关系式 + 组锚 + 箭头', src:
`[frame #board] @pos(-40,-40) @size(880,420) @text("示例 · 关系式") @color(gray)
[card #s0 create] @pos(0,0) @size(220,100) @color(blue) @group("已完成") @title("Step 0 清场")
[card #s1 create] below #s0 @gap(16) @color(blue) @group("已完成") @title("Step 1 剥离")
[card #e1 create] right-of @已完成 @gap(60) @color(red) @group("实验") @title("Step 2 实验")
[card #e2 create] below #e1 @gap(16) @color(red) @group("实验") @title("组级相对锚")
[card #x1 create] right-of @实验 @gap(60) @color(yellow) @group("出口") @title("npm 发布")
[arrow #a1] from #s1 to #e1 @label("喂出需求")
[arrow #a2] from #e2 to #x1 @label("闭环") @dash(dashed) @route(elbow)` },
  { name: '绝对坐标 + 障碍箭头', src:
`[card #a create] @pos(0,0) @size(200,100) @title("A")
[card #b create] @pos(600,300) @size(200,100) @title("B")
[card #c create] @pos(552,150) @size(64,100) @title("障碍")
[arrow #ab] from #a to #b
[arrow #ab2] from #b to #a @route(elbow) @dash(dotted)` },
  { name: '编辑语法 + text/compute', src:
`[card #a create] @pos(0,0) @size(200,100) @title("A")
[card #a] @title("A 改名") @color(yellow)
[text #t] @pos(0,200) @text("文本节点")
[text #s] @pos(260,200) @compute("#a.w + 100")` },
]
const dslIn = document.getElementById('dsl-in')
const sampleSel = document.getElementById('dsl-sample')
for (const s of SAMPLES) { const o = document.createElement('option'); o.textContent = s.name; sampleSel.appendChild(o) }
sampleSel.addEventListener('change', () => { dslIn.value = SAMPLES[sampleSel.selectedIndex].src; runDsl() })
dslIn.addEventListener('input', () => { clearTimeout(dslIn._t); dslIn._t = setTimeout(runDsl, 300) })

function runDsl() {
  const t0 = performance.now()
  const a = K.parseDslWithDiagnostics(dslIn.value)
  const b = K.sanitizeDslOps(a.ops)
  const c = K.solveRelational(b.ops)
  const { svg: svgStr, skipped } = K.toSvg(c.ops)
  const ms = (performance.now() - t0).toFixed(1)
  const cards = c.ops.filter((o) => o.type === 'card').length
  const arrows = c.ops.filter((o) => o.type === 'arrow').length
  document.getElementById('dsl-stats').innerHTML =
    `<span>耗时 <b>${ms}ms</b></span><span>卡 <b>${cards}</b></span><span>箭头 <b>${arrows}</b></span>` +
    `<span>解析错 <b>${a.errors.length}</b></span><span>sanitize 诊断 <b>${b.diagnostics.length}</b></span>` +
    `<span>solve 诊断 <b>${c.diagnostics.length}</b></span><span>toSvg 跳过 <b>${skipped.length}</b></span>`
  const diags = []
  for (const e of a.errors) diags.push(`<div class="e">L${e.line ?? '?'} ${esc(e.message ?? JSON.stringify(e))}</div>`)
  for (const d of [...b.diagnostics, ...c.diagnostics]) diags.push(`<div class="w">${esc(d.message ?? JSON.stringify(d))}</div>`)
  for (const s of skipped) diags.push(`<div class="w">toSvg 跳过:${esc(s.reason ?? JSON.stringify(s))}</div>`)
  document.getElementById('dsl-diag').innerHTML = diags.join('') || '<div style="color:var(--ok)">无诊断</div>'
  document.getElementById('dsl-svg').innerHTML = svgStr.replace('<svg ', '<svg style="max-width:100%;height:auto" ')
}

/* ————— 标签切换 ————— */
document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach((x) => x.classList.toggle('on', x === b))
  document.getElementById('tab-route').hidden = b.dataset.tab !== 'route'
  document.getElementById('tab-dsl').hidden = b.dataset.tab !== 'dsl'
}))

/* ————— 启动 ————— */
applyScene(structuredClone(PRESETS.stagger))
dslIn.value = SAMPLES[0].src
runDsl()
runSelfTest()
</script>
