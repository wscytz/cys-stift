name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # 不指定 version:自动从 package.json 的 packageManager(pnpm@9.15.0)读,
      # 避免与 packageManager 字段冲突(ERR_PNPM_BAD_PM_VERSION)。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: public docs links
        run: pnpm docs:links

      - name: generated version sync
        run: |
          node scripts/gen-version.mjs
          git diff --exit-code -- \
            apps/web/src/lib/version.ts \
            apps/web/package.json \
            apps/desktop/package.json \
            apps/desktop/src-tauri/Cargo.toml \
            apps/desktop/src-tauri/Cargo.lock \
            apps/desktop/src-tauri/tauri.conf.json

      - name: workspace typecheck (including web test fixtures)
        run: pnpm -r lint

      - name: domain test
        run: pnpm --filter domain --fail-if-no-match test

      - name: db test
        run: pnpm --filter db --fail-if-no-match test

      - name: cys-dsl test
        run: pnpm --filter @wscytz/dsl --fail-if-no-match test

      - name: cys-dsl offline package smoke
        run: pnpm --filter @wscytz/dsl --fail-if-no-match verify:pack

      - name: canvas-engine test
        run: pnpm --filter @cys-stift/canvas-engine --fail-if-no-match test

      - name: web test
        run: pnpm --filter web --fail-if-no-match test

      - name: web build (includes web typecheck)
        run: pnpm --filter web --fail-if-no-match build

      - name: approval demo (DSL confirm chain)
        run: pnpm demo:approval
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: DSL seed e2e (?dsl= entry)
        run: pnpm e2e:dsl-seed
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: visual e2e (DSL preview + meta persistence)
        run: pnpm e2e:visual
        env:
          CHROME_PATH: /usr/bin/google-chrome
  build-tauri-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: build tauri (windows)
        working-directory: apps/desktop
        # --ci: 跳过交互式提示。
        # --bundles nsis: 只生成 NSIS installer。tauri.conf.json 的
        #   "targets":"all" 在 Windows 上会同时生成 NSIS + MSI,而 MSI
        #   需要 WiX 工具链——这是 Windows CI 最常见的 bundling 失败点。
        #   命令行覆盖只影响 CI,不改本地 macOS build(本地仍生成 .app/.dmg)。
        run: pnpm tauri build --ci --bundles nsis

      - name: upload windows installer
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cy-s-stift-windows
          if-no-files-found: error
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
